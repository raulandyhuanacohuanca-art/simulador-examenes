<script>
(()=>{'use strict';
const BANK=JSON.parse(document.getElementById('dataset').textContent);
const COURSES=[['historia','Historia'],['economia','Economía'],['lenguaje','Lenguaje y comunicación'],['gramatica','Gramática y razonamiento'],['verbal','Sinónimos y analogías']];
const root=document.getElementById('root'), modal=document.getElementById('modal');
const Q=new Map(BANK.map(q=>[q.id,q]));
const exams=[];
for(const [slug,name] of COURSES){ const own=BANK.filter(q=>q.course===slug);const groups=[...new Set(own.map(q=>q.practice))];for(const idx of groups){const z=own.filter(q=>q.practice===idx);exams.push({key:slug+'-'+idx,course:slug,practice:idx,title:(z[0].group||'Práctica '+idx),questions:z});}}
let selectedCourse='all',current=null,loc=0,view='home',reviewFilter='all',includeProvisional=false;
// Versión web: guardado automático permanente por origen HTTPS con localStorage e IndexedDB.
// No depende de descargar una nueva copia para recordar cada cambio.
let responses={},customKeys={},lastSavedAt=0,editedSinceOpen=false;
let localWriteOK=false,dbOK=false;
const hosted=location.protocol==='https:'||location.protocol==='http:';
function updateStorageIndicator(){const el=document.getElementById('autoStateHeader');if(!el)return;el.textContent=hosted?((localWriteOK||dbOK)?'● Guardado automático':'◉ Comprobando guardado'):'◉ Archivo local: guardado limitado';}
const STORE_V2='simu_state_2026_v2';
try{const ping='simu_autoguardado_ok';localStorage.setItem(ping,'1');localWriteOK=localStorage.getItem(ping)==='1';localStorage.removeItem(ping);}catch{localWriteOK=false;}
updateStorageIndicator();
function readEmbedded(){
  try {const node=document.getElementById('embedded-state');return node?JSON.parse(node.textContent):null;}catch{return null;}
}
function validObject(o){return o&&typeof o==='object'&&!Array.isArray(o)?o:{};}
function loadSnapshot(s){
  responses=validObject(s?.respuestas);customKeys=validObject(s?.claves_personales);
  lastSavedAt=Number(s?.guardado_en)||0;
}
function stateSnapshot(){return {simulador:'v2',guardado_en:lastSavedAt||Date.now(),fecha:new Date().toISOString(),respuestas:responses,claves_personales:customKeys};}
const embedded=readEmbedded();
try{
  const raw=localStorage.getItem(STORE_V2),stored=raw?JSON.parse(raw):null;
  if(stored||embedded)loadSnapshot(!stored?embedded:!embedded?stored:(Number(stored.guardado_en||0)>=Number(embedded.guardado_en||0)?stored:embedded));
  else {responses=validObject(JSON.parse(localStorage.getItem('simu_answers_2026')||'{}'));
        customKeys=validObject(JSON.parse(localStorage.getItem('simu_keys_2026')||'{}'));}
}catch{if(embedded)loadSnapshot(embedded);}
let dbConnection=null;
function openDb(){
  if(!('indexedDB' in window))return;
  try{
    const req=indexedDB.open('simulador_examenes_2026',1);
    req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('datos'))req.result.createObjectStore('datos');};
    req.onsuccess=()=>{
      dbConnection=req.result;dbOK=true;updateStorageIndicator();
      const t=dbConnection.transaction('datos','readonly');const get=t.objectStore('datos').get('progreso');
      get.onsuccess=()=>{
        const s=get.result;
        if(s&&Number(s.guardado_en||0)>lastSavedAt&&!editedSinceOpen){loadSnapshot(s);if(view==='home')home();}
        // Guardar copia cuando el almacenamiento anterior era el más reciente.
        if(!s||lastSavedAt>Number(s.guardado_en||0))writeDb();
      };
    };
    req.onerror=()=>{dbOK=false;};
  }catch{dbOK=false;}
}
function writeDb(){
  if(!dbConnection)return;
  try{const t=dbConnection.transaction('datos','readwrite');t.objectStore('datos').put(stateSnapshot(),'progreso');}catch{dbOK=false;}
}
function save(){
  editedSinceOpen=true;lastSavedAt=Date.now();const state=stateSnapshot();
  try{
    localStorage.setItem('simu_answers_2026',JSON.stringify(responses));
    localStorage.setItem('simu_keys_2026',JSON.stringify(customKeys));
    localStorage.setItem(STORE_V2,JSON.stringify(state));
    localWriteOK=!!localStorage.getItem(STORE_V2);
  }catch{localWriteOK=false;}
  writeDb();updateStorageIndicator();
}
function exportPortable(){
  // La copia conserva las respuestas y claves dentro del HTML, independientemente del navegador.
  const state=stateSnapshot();state.guardado_en=Date.now();state.fecha=new Date().toISOString();
  const clone=document.documentElement.cloneNode(true);
  const r=clone.querySelector('#root'),m=clone.querySelector('#modal');if(r)r.innerHTML='';if(m){m.innerHTML='';m.className='modal hide';}
  const prior=clone.querySelector('#embedded-state');if(prior)prior.remove();
  const data=clone.ownerDocument.createElement('script');data.id='embedded-state';data.type='application/json';
  data.textContent=JSON.stringify(state).replace(/</g,'\\u003c');
  const scripts=[...clone.querySelectorAll('script')];const runtime=scripts[scripts.length-1];
  runtime.parentNode.insertBefore(data,runtime);
  const file='SIMULADOR_CON_MIS_CLAVES_'+new Date().toISOString().slice(0,10)+'.html';
  downloadFile('<!DOCTYPE html>\n'+clone.outerHTML,file,'text/html');
  showModal('<h2 class="sectionTitle">Copia descargada</h2><p class="sub">Guarda el archivo HTML que acabas de descargar en <strong>Archivos/Descargas</strong>. Para continuar otro día, abre <strong>esa copia más reciente</strong> en vez del archivo original. Si añades más claves, descarga una copia nueva antes de cerrar.</p><div class="note">Esto protege tus claves aunque el navegador elimine su almacenamiento.</div><button class="btn full" id="okay">Entendido</button>');
  modal.querySelector('#okay').onclick=closeModal;
}
function storageTip(){
 const count=Object.keys(customKeys).length;
 if(hosted)return `<div class="note" style="margin-top:13px"><strong>● Guardado automático ${localWriteOK||dbOK?'activo':'en comprobación'}.</strong> Tus respuestas y las <strong>${count} claves</strong> que hayas agregado se guardan al marcarlas. Puedes cerrar y volver a abrir <strong>esta misma dirección web</strong> en el mismo navegador; no hace falta descargar copias. Si borras los datos del sitio o cambias de navegador/dispositivo, no se sincronizarán automáticamente. El respaldo manual es opcional.</div>`;
 return `<div class="note warning" style="margin-top:13px"><strong>Estás abriendo un archivo descargado.</strong> En el celular, los datos de los archivos locales pueden perderse entre sesiones. Para que el autoguardado sea estable, publica este archivo como una <strong>página web HTTPS</strong> y entra siempre por el mismo enlace. El respaldo manual sigue disponible por seguridad.</div>`;
}

const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ');
const qresp=q=>responses[q.id]||'';
const isAnswered=q=>qresp(q).trim().length>0;
const resolvedKey=q=>{if(customKeys[q.id])return {v:customKeys[q.id],tier:'personal'};if(q.answer&&((q.confidence==='verified')||(includeProvisional&&q.confidence==='review')))return {v:q.answer,tier:q.confidence};if(q.answerText&&((q.confidence==='verified')||(includeProvisional&&q.confidence==='review')))return {v:q.answerText,tier:q.confidence};return null;};
function quality(q){return resolvedKey(q)?true:false;}
function judge(q){let key=resolvedKey(q),resp=qresp(q);if(!resp)return 'blank';if(!key)return 'ungraded';if(!q.options.length)return norm(resp)===norm(key.v)?'correct':'wrong';return resp===key.v?'correct':'wrong';}
function calc(ex){let good=0,bad=0,blank=0,ung=0,keyed=0;for(const q of ex.questions){const st=judge(q);if(quality(q))keyed++;if(st==='correct')good++;else if(st==='wrong')bad++;else if(st==='blank')blank++;else ung++;}const score=keyed>0?Math.max(0,Math.min(20,((good-.5*bad)/keyed)*20)):null;return {good,bad,blank,ung,keyed,score,done:ex.questions.filter(isAnswered).length};}
function setHead(title,intro){document.getElementById('pageTitle').textContent=title;document.getElementById('pageIntro').textContent=intro;document.title=title+' · Simulador';}
function courseLabel(c){return COURSES.find(x=>x[0]===c)?.[1]||c;}
function briefTitle(ex){if(ex.course==='gramatica'&&ex.practice===4)return 'Práctica 3 · Anexo de sustantivos';const shown=(ex.course==='gramatica'&&ex.practice===5)?4:ex.practice;const s=ex.title.replace(/PRÁCTICA\s*\d+\s*[—·-]?/i,'').replace(/\s*\(1[–-]\d+\)/,'').trim();return 'Práctica '+shown+(s?' · '+s:'');}
function goTop(){window.scrollTo({top:0,behavior:'instant'});}
function home(){view='home';current=null;setHead('Practica y mide tu progreso','Elige una materia y continúa cuando quieras. Las respuestas y claves se guardan automáticamente cuando abres la misma dirección web en este navegador.');
const tabs=[['all','Todas las materias'],...COURSES].map(([id,n])=>`<button type="button" class="tab ${selectedCourse===id?'active':''}" data-course="${h(id)}">${h(n)}</button>`).join('');
const visible=exams.filter(ex=>selectedCourse==='all'||ex.course===selectedCourse);
root.innerHTML=`<div class="course-tabs">${tabs}</div><div class="panel pad"><h2 class="sectionTitle">Tu banco de exámenes</h2><div class="sub">${BANK.length} preguntas recuperadas de tus documentos · ${exams.length} prácticas · alternativas originales y respuestas cortas donde corresponde.</div><div class="stats"><span><strong>+1</strong> por acierto</span><span><strong>−0.5</strong> por error</span><span><strong>0</strong> por blanco</span><span><strong>Escala:</strong> 0 a 20</span></div><div class="flex" style="margin-top:15px"><button class="btn sm" id="savePortable">Descargar respaldo (opcional)</button><button class="btn alt sm" id="backup">Respaldo (.json)</button><label class="btn light sm" for="uploadProgress" style="cursor:pointer">Importar respaldo</label><input id="uploadProgress" class="hide" type="file" accept=".json,application/json"></div><div class="note" style="margin-top:15px"><strong>Claves con revisión:</strong> algunas preguntas están mal formuladas, carecen de alternativa válida o todavía no tienen una clave confirmada. No inventamos esas respuestas. Puedes incluir claves provisionales si lo deseas o añadir una clave docente en la revisión.</div>${storageTip()}</div><div class="examgrid">${visible.map(ex=>{const s=calc(ex),v=ex.questions.filter(q=>q.confidence==='verified'||q.answerText&&q.confidence==='verified').length;return `<div class="panel examcard"><div class="minilabel">${h(courseLabel(ex.course))}</div><h3>${h(briefTitle(ex))}</h3><div class="desc">${ex.questions.length} preguntas · ${v} claves revisadas · ${s.done} respondidas</div><div class="progressbar"><div class="progressfill" style="width:${s.done/ex.questions.length*100}%"></div></div><button class="btn full" data-open="${h(ex.key)}">${s.done?'Continuar examen':'Comenzar examen'}</button></div>`}).join('')}</div><div class="foot">Modo sin internet: los datos y la calificación están contenidos en este archivo HTML. Para conservar el progreso abre siempre la misma página web en el mismo navegador; el respaldo es opcional.</div>`;
root.querySelector('#savePortable').onclick=exportPortable;root.querySelector('#backup').onclick=exportProgress;root.querySelector('#uploadProgress').onchange=importProgress;root.querySelectorAll('[data-course]').forEach(el=>el.addEventListener('click',()=>{selectedCourse=el.dataset.course;home();}));root.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>openExam(el.dataset.open)));}
function openExam(key){current=exams.find(z=>z.key===key);if(!current)return;loc=Math.max(0,current.questions.findIndex(q=>!isAnswered(q)));view='exam';renderExam();goTop();}
function renderExam(){const ex=current;if(!ex)return;view='exam';const q=ex.questions[loc],n=ex.questions.length;const done=ex.questions.filter(isAnswered).length;setHead(briefTitle(ex),courseLabel(ex.course)+' · Preguntas '+n+' · Responde a tu ritmo.');
const opt=q.options.length?q.options.map(o=>`<label class="opt"><input type="radio" name="answer" value="${h(o.value)}" ${qresp(q)===o.value?'checked':''}><strong>${h(o.value)})</strong><span>${h(o.label)}</span></label>`).join(''):`<label for="textAns" class="sub">Escribe tu respuesta:</label><input id="textAns" class="input" autocomplete="off" placeholder="Respuesta" value="${h(qresp(q))}">`;
root.innerHTML=`<div class="examtop"><div><div class="eyebrow">${h(courseLabel(ex.course))}</div><h2 class="examtitle">${h(briefTitle(ex))}</h2><span class="sub">Pregunta ${loc+1} de ${n} · Número original ${q.number}</span></div><div class="flex"><button type="button" class="btn alt sm" id="back">← Materias</button><button type="button" class="btn sm" id="finalize">Finalizar examen</button></div></div><div class="progressbox"><div class="progressbar"><div class="progressfill" style="width:${done/n*100}%"></div></div><div class="progresstxt"><span>${done} respondidas</span><span>${n-done} pendientes</span></div></div><div class="panel pad"><div class="qtop"><span class="qnum">PREGUNTA ${q.number}</span><span class="qstatus">${isAnswered(q)?'Respondida':'Pendiente'}</span></div><p class="question">${h(q.stem)}</p><div class="opts">${opt}</div><div class="qnav"><button class="btn alt" id="prev" ${loc===0?'disabled':''}>← Anterior</button><button class="btn alt" id="clear" ${!isAnswered(q)?'disabled':''}>Borrar respuesta</button><button class="btn" id="next">${loc===n-1?'Volver al inicio':'Siguiente →'}</button></div></div><div class="panel pad" style="margin-top:15px"><div class="flex between"><strong>Ir a una pregunta</strong><span class="sub">Verde = contestada</span></div><div class="numbergrid" id="numbers">${ex.questions.map((z,i)=>`<button type="button" class="numb ${i===loc?'current':''} ${isAnswered(z)?'answered':''}" data-go="${i}">${z.number}</button>`).join('')}</div></div><div class="foot">Las alternativas se muestran sin revelar la respuesta durante el examen. Puedes dejar preguntas en blanco: valen 0 y no generan penalización.</div>`;
const answerInputs=root.querySelectorAll('input[name=answer]');for(const i of answerInputs)i.addEventListener('change',()=>{responses[q.id]=i.value;save();renderExam();});const text=root.querySelector('#textAns');if(text)text.addEventListener('input',()=>{responses[q.id]=text.value;save();});
root.querySelector('#prev').addEventListener('click',()=>{loc--;renderExam();goTop();});root.querySelector('#next').addEventListener('click',()=>{loc=(loc+1)%n;renderExam();goTop();});root.querySelector('#clear').addEventListener('click',()=>{delete responses[q.id];save();renderExam();});root.querySelector('#back').addEventListener('click',()=>home());root.querySelector('#finalize').addEventListener('click',confirmEnd);root.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{loc=+b.dataset.go;renderExam();goTop();}));}
function showModal(html){modal.innerHTML='<div class="panel">'+html+'</div>';modal.classList.remove('hide');}
function closeModal(){modal.classList.add('hide');modal.innerHTML='';}
function confirmEnd(){const ex=current,n=ex.questions.length,done=ex.questions.filter(isAnswered).length;showModal(`<h2 class="sectionTitle">¿Finalizar esta práctica?</h2><p class="sub">Has respondido <strong>${done}</strong> de <strong>${n}</strong> preguntas. Las que dejaste en blanco no descuentan puntos.</p><div class="note warning">El resultado solo podrá calificar preguntas con una clave disponible. Las ambiguas o no verificadas se mostrarán por separado.</div><div class="flex between" style="margin-top:20px"><button class="btn alt" id="cancel">Seguir respondiendo</button><button class="btn" id="confirm">Ver mi resultado</button></div>`);modal.querySelector('#cancel').onclick=closeModal;modal.querySelector('#confirm').onclick=()=>{closeModal();reviewFilter='all';renderResults();goTop();};}
function renderResults(){view='results';const ex=current;setHead('Resultados de tu práctica',courseLabel(ex.course)+' · '+briefTitle(ex));const s=calc(ex);
const score=s.score===null?'—':s.score.toFixed(2);const ratio=s.keyed<ex.questions.length?`La nota es <strong>parcial</strong>: se calcula sobre ${s.keyed} preguntas con clave, no sobre las ${ex.questions.length} del examen.`:`La nota incluye todas las preguntas de esta práctica.`;
root.innerHTML=`<div class="flex between" style="margin-bottom:17px"><button class="btn alt sm" id="home">← Todas las materias</button><button class="btn alt sm" id="resume">Revisar mis respuestas en el examen</button></div><div class="panel pad"><div class="eyebrow">${h(briefTitle(ex))}</div><div class="scorebox"><div><div class="sub">Nota vigesimal ${includeProvisional?'con claves provisionales incluidas':'con claves revisadas'}</div><div class="score">${score}<span> / 20</span></div></div><div class="note" style="max-width:460px;flex:1">${ratio}<div style="margin-top:6px">Cálculo: (${s.good} aciertos − 0.5 × ${s.bad} errores) ÷ ${s.keyed||'—'} × 20.</div></div></div><div class="kpis"><div class="kpi"><span class="ok">${s.good}</span><small>Correctas</small></div><div class="kpi"><span class="wrong">${s.bad}</span><small>Incorrectas</small></div><div class="kpi"><span>${s.blank}</span><small>Sin responder</small></div><div class="kpi"><span class="unk">${s.ung}</span><small>Sin calificar</small></div></div><div class="note warning">Las respuestas sin clave segura no se suman a los errores. Puedes revisarlas y, si tienes una clave oficial del docente, añadirla abajo.</div><label class="switch" style="margin-top:15px"><input id="includeTemp" type="checkbox" ${includeProvisional?'checked':''}>Incluir claves provisionales en la nota (estimación, pueden contener errores)</label><div class="flex" style="margin-top:15px"><button class="btn sm" id="savePortable">Descargar respaldo (opcional)</button><button class="btn alt sm" id="backup">Respaldo (.json)</button><label class="btn light sm" for="uploadProgress" style="cursor:pointer">Importar respaldo</label><input id="uploadProgress" class="hide" type="file" accept=".json,application/json"><button class="btn alt sm" id="export">Guardar resumen (.txt)</button><button class="btn red sm" id="reset">Borrar respuestas de esta práctica</button></div>${storageTip()}</div><div class="panel pad" style="margin-top:17px"><h2 class="sectionTitle">Revisión de preguntas</h2><p class="sub">Verde: correcta · rojo: incorrecta · ámbar: clave pendiente. Puedes modificar una clave únicamente cuando cuentes con la corrección de tu profesor.</p><div class="filterrow">${[['all','Todas'],['wrong','Mis errores'],['ungraded','Sin calificar'],['blank','En blanco'],['correct','Correctas']].map(([k,n])=>`<button class="btn ${reviewFilter===k?'':'alt'} sm" data-filter="${k}">${n}</button>`).join('')}</div><div id="answers"></div></div>`;
root.querySelector('#home').onclick=home;root.querySelector('#resume').onclick=()=>{view='exam';renderExam();goTop();};root.querySelector('#includeTemp').onchange=e=>{includeProvisional=e.target.checked;renderResults();};root.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{reviewFilter=b.dataset.filter;renderResults();});root.querySelector('#savePortable').onclick=exportPortable;root.querySelector('#backup').onclick=exportProgress;root.querySelector('#uploadProgress').onchange=importProgress;root.querySelector('#export').onclick=exportResults;root.querySelector('#reset').onclick=()=>{showModal(`<h2 class="sectionTitle">¿Borrar tus respuestas?</h2><p class="sub">Esta acción borra solamente las respuestas de ${h(briefTitle(ex))}.</p><div class="flex"><button class="btn alt" id="no">Cancelar</button><button class="btn red" id="yes">Sí, borrar</button></div>`);modal.querySelector('#no').onclick=closeModal;modal.querySelector('#yes').onclick=()=>{for(const q of ex.questions)delete responses[q.id];save();closeModal();openExam(ex.key)};};
renderAnswerCards();}
function renderAnswerCards(){const ex=current,list=ex.questions.filter(q=>reviewFilter==='all'||judge(q)===reviewFilter);let ct=document.getElementById('answers');if(!ct)return;if(!list.length){ct.innerHTML='<div class="empty">No hay preguntas con ese estado.</div>';return;}
ct.innerHTML=list.map(q=>{const state=judge(q),k=resolvedKey(q),resp=qresp(q),tr={'correct':['ok','Correcta'],'wrong':['wrong','Incorrecta'],'blank':['muted','Sin responder'],'ungraded':['unk','Sin clave verificada']}[state];const keyLabel=k?(q.options.find(x=>x.value===k.v)?.label||k.v):'';
const allOpts=q.options.length?q.options.map(o=>`<div class="${k?.v===o.value?'correct':''} ${resp===o.value&&state==='wrong'?'incorrect':''}">${h(o.value)}) ${h(o.label)}${resp===o.value?' · Tu respuesta':''}${k?.v===o.value?' · Clave':''}</div>`).join(''):`<div>Tu respuesta: ${h(resp||'(en blanco)')}</div>`;
return `<section class="panel answercard"><div class="resultTop"><div class="qnum">PREGUNTA ${q.number}</div><div class="resultLabel ${tr[0]}">${tr[1]}</div></div><h3>${h(q.stem)}</h3><div class="smallopts">${allOpts}</div>${k?`<div class="sub" style="margin-top:9px">Clave ${k.tier==='personal'?'introducida por ti':k.tier==='review'?'provisional':'revisada'}: <strong>${h(k.v)}${keyLabel?' · '+h(keyLabel):''}</strong></div>`:`<div class="sub" style="margin-top:8px">No se asignó clave automática para evitar calificar sin respaldo.</div>`}${q.explain?`<p class="sub">${h(q.explain)}</p>`:''}<div class="reviewkeys"><span>Clave del profesor:</span>${q.options.length?`<select data-key="${h(q.id)}"><option value="">Sin asignar</option>${q.options.map(o=>`<option ${customKeys[q.id]===o.value?'selected':''} value="${h(o.value)}">${h(o.value)})</option>`).join('')}</select>`:`<input class="input" data-key="${h(q.id)}" placeholder="Respuesta oficial" style="width:170px" value="${h(customKeys[q.id]||'')}">`}<button type="button" class="btn alt sm" data-clear-key="${h(q.id)}">Quitar clave personal</button></div></section>`}).join('');
ct.querySelectorAll('[data-key]').forEach(el=>{
  if(el.tagName==='INPUT')el.addEventListener('input',()=>{if(el.value.trim())customKeys[el.dataset.key]=el.value.trim();else delete customKeys[el.dataset.key];save();});
  el.addEventListener('change',()=>{if(el.value.trim())customKeys[el.dataset.key]=el.value.trim();else delete customKeys[el.dataset.key];save();renderResults();});
});ct.querySelectorAll('[data-clear-key]').forEach(el=>el.addEventListener('click',()=>{delete customKeys[el.dataset.clearKey];save();renderResults();}));}
function exportProgress(){const body=JSON.stringify({simulador:'v1',fecha:new Date().toISOString(),respuestas:responses,claves_personales:customKeys},null,2);downloadFile(body,'mis_respuestas_simulador.json','application/json');}
async function importProgress(e){const file=e.target.files?.[0];if(!file)return;try{const o=JSON.parse(await file.text());if(!o||o.simulador!=='v1'||typeof o.respuestas!=='object')throw new Error('Formato no válido');let imported=0;for(const [id,value] of Object.entries(o.respuestas)){if(Q.has(id)&&typeof value==='string'){responses[id]=value;imported++;}}for(const [id,value] of Object.entries(o.claves_personales||{})){if(Q.has(id)&&typeof value==='string')customKeys[id]=value;}save();showModal(`<h2 class="sectionTitle">Progreso importado</h2><p class="sub">Se restauraron ${imported} respuestas y las claves incluidas en el respaldo. Si usas la página web desde el mismo navegador, quedarán guardadas automáticamente.</p><button class="btn full" id="okay">Continuar</button>`);modal.querySelector('#okay').onclick=()=>{closeModal();home();};}catch{showModal('<h2 class="sectionTitle">No se pudo importar</h2><p class="sub">Selecciona un archivo JSON exportado por este mismo simulador.</p><button class="btn full" id="okay">Aceptar</button>');modal.querySelector('#okay').onclick=closeModal;}}
function downloadFile(contents,filename,mime){const blob=new Blob([contents],{type:mime+';charset=utf-8'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function exportResults(){let ex=current,s=calc(ex);let out=`SIMULADOR DE EXÁMENES\n${courseLabel(ex.course)} / ${briefTitle(ex)}\nFecha: ${new Date().toLocaleString('es-PE')}\nCorrectas: ${s.good} | Incorrectas: ${s.bad} | Blancas: ${s.blank} | Sin calificar: ${s.ung}\nNota: ${s.score===null?'Sin claves disponibles':s.score.toFixed(2)+' / 20'} (sobre ${s.keyed} preguntas con clave)\nCriterio: +1 correcta, -0.5 incorrecta, 0 blanca.\n\n`;
for(const q of ex.questions){let k=resolvedKey(q);out+=`${q.number}. ${q.stem}\n   Respondí: ${qresp(q)||'EN BLANCO'} | Clave: ${k?.v||'PENDIENTE'} | Estado: ${judge(q)}\n`;}
let blob=new Blob([out],{type:'text/plain;charset=utf-8'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='resultado_'+ex.key+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}
window.addEventListener('keydown',e=>{if(view==='exam'&&!e.altKey&&!e.metaKey&&!(e.target instanceof HTMLInputElement)){if(e.key==='ArrowRight'&&loc<current.questions.length-1){loc++;renderExam()}if(e.key==='ArrowLeft'&&loc>0){loc--;renderExam()}}});
home();
openDb();
})();
</script>
</body></html>
